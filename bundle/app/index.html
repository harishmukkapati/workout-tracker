<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar"></div>
  <div class="shell">
    <nav class="nav" aria-label="Main">
      <div class="brand" aria-label="Workout Tracker">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <rect x="4" y="13" width="6" height="14" rx="3" fill="#4285F4"/>
          <rect x="11" y="8" width="6" height="24" rx="3" fill="#EA4335"/>
          <rect x="17" y="18" width="6" height="4" rx="2" fill="#9AA0A6"/>
          <rect x="23" y="8" width="6" height="24" rx="3" fill="#FBBC04"/>
          <rect x="30" y="13" width="6" height="14" rx="3" fill="#34A853"/>
        </svg>
      </div>
      <button class="nav-btn" data-nav="today"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg></span>Today</button>
      <button class="nav-btn" data-nav="calendar"><span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Streaks</button>
      <button class="nav-btn" data-nav="progress"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 3 5-6"/></svg></span>Progress</button>
      <button class="nav-btn" data-nav="nutrition"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M12 7.5c-1.6-1.3-4.6-1.6-6.3.4-2 2.4-1.2 7 1 10 1.4 1.9 3 2.6 5.3 1.6 2.3 1 3.9.3 5.3-1.6 2.2-3 3-7.6 1-10-1.7-2-4.7-1.7-6.3-.4Z"/><path d="M12 7.5c0-2 .8-3.6 2.6-4.5"/></svg></span>Nutrition</button>
      <button class="nav-btn" data-nav="history"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5M12 8v4.5l3 2"/></svg></span>History</button>
      <button class="nav-btn" data-nav="settings"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></span>Settings</button>
      <div class="nav-foot" id="nav-foot"></div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="foods.js"></script>
  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
